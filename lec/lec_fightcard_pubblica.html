<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEC PADOVA 01 · Fight Card LIVE</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050507;color:#fff;font-family:Arial,Helvetica,sans-serif}body{background:radial-gradient(ellipse at 50% 55%,#302516 0%,#0b0b0e 55%,#020203 100%)}.stage{height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}.stage:before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#d2a84b0 0deg 12deg,#c4a05a12 13deg 14deg);animation:spin 65s linear infinite;pointer-events:none}.stage:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0009,transparent 24%,transparent 76%,#0009),linear-gradient(0deg,#000a,transparent 22%,transparent 80%,#0008);pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}.top{position:absolute;top:5%;z-index:3;text-align:center;width:100%;letter-spacing:.25em;font-size:clamp(13px,2vw,24px);font-weight:900;color:#e5c47c;text-shadow:0 2px 12px #000}.top small{display:block;font-size:.42em;letter-spacing:.55em;margin-top:10px;color:#eee}.title{position:absolute;top:18%;z-index:3;text-align:center;font-size:clamp(18px,3.5vw,47px);font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#f0d18c;text-shadow:0 0 32px #aa752777}.match{width:min(96vw,1500px);height:65%;display:grid;grid-template-columns:1fr minmax(75px,15%) 1fr;align-items:end;position:relative;z-index:2}.person{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;animation:enterLeft .85s cubic-bezier(.2,.8,.2,1) both}.person.right{animation-name:enterRight}.portrait{height:70%;width:100%;display:flex;align-items:end;justify-content:center;position:relative}.portrait img{max-width:100%;width:auto;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 24px #b28b4255);mask-image:linear-gradient(#000 78%,transparent 100%);-webkit-mask-image:linear-gradient(#000 78%,transparent 100%)}.missing{height:88%;width:65%;max-width:300px;display:grid;place-items:center;font-size:clamp(70px,12vw,190px);color:#705e42;opacity:.55;background:linear-gradient(160deg,#292521,#09090b);clip-path:polygon(30% 0,70% 0,100% 30%,100% 100%,0 100%,0 30%)}.name{font-size:clamp(22px,3.4vw,60px);font-weight:1000;text-transform:uppercase;line-height:1;letter-spacing:.025em;overflow-wrap:anywhere;max-width:100%;text-shadow:0 4px 15px #000}.team{margin-top:13px;color:#d8b36b;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(12px,1.35vw,21px);overflow-wrap:anywhere}.vs{align-self:center;text-align:center;font-size:clamp(40px,7vw,100px);font-weight:1000;font-style:italic;color:#f1d397;text-shadow:0 0 34px #b68139;animation:vsPulse 2.5s ease-in-out infinite}.bottom{position:absolute;bottom:5%;z-index:3;text-align:center;letter-spacing:.22em;color:#d5c4a4;font-weight:800;font-size:clamp(12px,1.5vw,20px)}.line{width:160px;height:3px;background:linear-gradient(90deg,transparent,#d6a852,transparent);margin:14px auto}.controls{position:absolute;bottom:10px;right:12px;z-index:10;display:flex;gap:7px;align-items:center;opacity:.25;transition:opacity .2s}.controls:hover,.controls:focus-within{opacity:1}button,select{border:1px solid #a17a3b;background:#151518;color:#f4d8a0;padding:8px;border-radius:6px;cursor:pointer;font-size:12px}button:hover{background:#3b2e1c}.hint{position:absolute;bottom:11px;left:12px;z-index:5;font-size:11px;color:#aaa;opacity:.5}.progress{position:absolute;bottom:0;left:0;height:4px;background:#d9b66c;z-index:9;transition:width .15s linear}.stage.change .person,.stage.change .title{animation:fadeOut .35s both}@keyframes fadeOut{to{opacity:0;transform:scale(.96)}}@keyframes enterLeft{from{opacity:0;transform:translateX(-130px) scale(.92)}to{opacity:1;transform:none}}@keyframes enterRight{from{opacity:0;transform:translateX(130px) scale(.92)}to{opacity:1;transform:none}}@keyframes vsPulse{50%{filter:brightness(1.6);transform:scale(1.07)}}@media(max-width:650px){.match{height:58%;grid-template-columns:1fr 50px 1fr}.portrait{height:60%}.name{font-size:clamp(16px,4.3vw,28px)}.team{font-size:11px}.title{top:22%}.top{top:8%}.controls{opacity:.65;bottom:22px}.hint{display:none}}
</style></head><body><div class="stage" id="stage"><div class="top">LEC <span style="color:white">PADOVA 01</span><small>LUTADOR DE ELITE COMBAT</small></div><div class="title" id="boutTitle"></div><div class="match" id="match"></div><div class="bottom" id="footer"></div><div class="progress" id="progress"></div><div class="hint">La musica si attiva premendo “Avvia con musica”.</div><div class="controls"><button id="prev" title="Precedente">◀</button><button id="play" title="Avvia/Pausa">Pausa</button><button id="next" title="Successivo">▶</button><button id="sound" title="Musica">♫ Avvia con musica</button><button id="full" title="Schermo intero">⛶</button></div></div><script>
const extraNames=['SUPERFIGHT · DONNA','SUPERFIGHT · MASTER UOMO','SUPERFIGHT · ADULT UOMO','MMA PRO · CO-MAIN EVENT','MMA PRO · MAIN EVENT'];const defaultExtras=()=>extraNames.map(title=>({title,a:'Da definire',b:'Da definire',teamA:'',teamB:'',photoA:'',photoB:'',result:''}));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let extras=defaultExtras();function load(){try{let s=JSON.parse(localStorage.getItem('lecDemo'));if(Array.isArray(s?.extras)&&s.extras.length)extras=s.extras}catch(e){}}load();let idx=0,playing=true,duration=10000,started=performance.now(),audioCtx=null,osc=[],musicOn=false;const stage=document.getElementById('stage');function person(e,side){let a=side==='A',name=e[a?'a':'b']||'Da definire',team=e[a?'teamA':'teamB']||'TEAM DA DEFINIRE',photo=e[a?'photoA':'photoB']||'';return `<div class="person ${a?'left':'right'}"><div class="portrait">${photo?`<img src="${esc(photo)}" alt="${esc(name)}">`:'<div class="missing">♟</div>'}</div><div class="name">${esc(name)}</div><div class="team">${esc(team)}</div></div>`}function draw(){let e=extras[idx]||defaultExtras()[0];document.getElementById('boutTitle').textContent=idx===4?'MAIN EVENT':idx===3?'CO-MAIN EVENT':e.title||extraNames[idx]||'SUPERFIGHT';document.getElementById('match').innerHTML=person(e,'A')+'<div class="vs">VS</div>'+person(e,'B');document.getElementById('footer').innerHTML='LEC PADOVA 01<div class="line"></div>'+(idx+1)+' / '+extras.length;document.getElementById('progress').style.width='0%';started=performance.now()}function move(delta){stage.classList.add('change');setTimeout(()=>{idx=(idx+delta+extras.length)%extras.length;draw();stage.classList.remove('change')},350)}document.getElementById('next').onclick=()=>move(1);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('play').onclick=()=>{playing=!playing;started=performance.now();document.getElementById('play').textContent=playing?'Pausa':'Riprendi'};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};function music(){if(musicOn){osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[];musicOn=false;document.getElementById('sound').textContent='♫ Avvia con musica';return}try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let notes=[55,82.41,110];notes.forEach((hz,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=i===0?'sawtooth':'sine';o.frequency.value=hz;g.gain.value=i===0?.015:.012;o.connect(g).connect(audioCtx.destination);o.start();osc.push(o)});musicOn=true;document.getElementById('sound').textContent='♫ Disattiva musica'}catch(e){alert('Audio non disponibile in questo browser')}}document.getElementById('sound').onclick=music;function frame(t){if(playing&&!stage.classList.contains('change')){let elapsed=t-started;document.getElementById('progress').style.width=Math.min(100,elapsed/duration*100)+'%';if(elapsed>=duration)move(1)}requestAnimationFrame(frame)}draw();requestAnimationFrame(frame);window.addEventListener('storage',()=>{load();idx=Math.min(idx,extras.length-1);draw()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();draw()}});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '){e.preventDefault();document.getElementById('play').click()}});
</script></body></html>
