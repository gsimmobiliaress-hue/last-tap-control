<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEC PADOVA 01 · Tabellone pubblico</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eee;background:#101115}*{box-sizing:border-box}body{margin:0}header{padding:22px max(18px,calc((100vw - 1100px)/2));background:#191a20;border-bottom:1px solid #50432c}h1{margin:3px 0;font-size:27px}small,.muted{color:#b9b8b6}.gold{color:#e0bf73}main{max-width:1100px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}button{background:#27282f;border:1px solid #555;color:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}button.active,button.primary{background:#9c7a37;color:#111;border-color:#d3b269;font-weight:700}.panel{background:#1c1d23;border:1px solid #3b3c43;border-radius:12px;padding:18px;margin:12px 0}h2{margin-top:0;font-size:20px}h3{margin:10px 0}input,select{background:#111217;color:#fff;border:1px solid #555;border-radius:7px;padding:9px;width:100%;min-width:0}label{display:block;color:#c4c4c4;font-size:13px;margin:10px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.fight{border:1px solid #555;border-radius:9px;padding:12px;margin:9px 0;background:#22232a}.fighter{display:flex;justify-content:space-between;gap:8px;margin:8px 0}.fighter b{color:#e4c17c}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.score{max-width:75px}.tag{font-size:12px;color:#e0bf73}.hide{display:none}.wide{width:100%}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#080808}footer{padding:25px;text-align:center;color:#888;font-size:12px}.notice{border-left:3px solid #d4ae61;padding:10px;background:#29251c}.status{color:#a5d3a5}.bout{padding:10px 0;border-top:1px solid #3e3e43}.versus{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);align-items:center;gap:7px}.athlete-card{text-align:center;min-width:0}.athlete-card img,.placeholder{width:76px;height:88px;object-fit:cover;border-radius:8px;border:1px solid #7d683d;background:#14151a;display:block;margin:6px auto}.placeholder{display:flex;align-items:center;justify-content:center;color:#b99a5d;font-size:28px}.athlete-card strong{display:block;font-size:13px;overflow-wrap:anywhere}.athlete-card small{display:block;font-size:11px}.vs{font-size:13px;color:#e0bf73;font-weight:800;text-align:center}.upload-note{font-size:11px;color:#aaa}.photo-preview{height:64px;width:56px;object-fit:cover;border-radius:5px;border:1px solid #777;margin-top:6px}.match-title{margin-bottom:12px}.ufc-card{background:linear-gradient(145deg,#16171b,#08090c);border:1px solid #80632d;border-radius:14px;overflow:hidden;margin:18px 0;box-shadow:0 12px 35px #0008}.ufc-heading{background:linear-gradient(90deg,#a27b35,#d9b96c,#7c5a24);color:#15120b;text-align:center;font-weight:900;letter-spacing:2px;padding:10px;font-size:12px}.ufc-body{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);align-items:end;min-height:240px;padding:12px 8px 0;gap:3px}.ufc-person{text-align:center;min-width:0}.ufc-person img,.ufc-silhouette{width:100%;max-width:185px;height:175px;object-fit:cover;object-position:top center;margin:auto;display:block;mask-image:linear-gradient(#000 75%,transparent 100%);-webkit-mask-image:linear-gradient(#000 75%,transparent 100%)}.ufc-silhouette{display:flex;justify-content:center;align-items:center;font-size:60px;color:#777;background:linear-gradient(#333,#111)}.ufc-name{font-size:clamp(15px,2.6vw,23px);font-weight:950;text-transform:uppercase;overflow-wrap:anywhere;line-height:1.1;min-height:50px}.ufc-team{font-size:12px;color:#d2b36e;margin:6px 0 12px;overflow-wrap:anywhere}.ufc-vs{text-align:center;align-self:center;font-weight:1000;color:#e0bb66;font-size:28px;font-style:italic}.ufc-footer{text-align:center;padding:9px;background:#22232a;font-size:12px;color:#d5d5d5}.ufc-file{font-size:12px}.ufc-preview{width:55px;height:60px;object-fit:cover;border-radius:6px;margin-top:7px}@media(max-width:520px){.ufc-body{grid-template-columns:minmax(0,1fr) 43px minmax(0,1fr);min-height:190px}.ufc-person img,.ufc-silhouette{height:125px}.ufc-vs{font-size:21px}.ufc-name{min-height:38px}} body{background:#08090b}main{max-width:1400px}h1{text-align:center;color:#dfbc70;letter-spacing:.09em}.fight{background:#171719}.ufc-card{max-width:1000px;margin:24px auto}.ufc-body{min-height:340px}.ufc-person img,.ufc-silhouette{height:260px;max-width:250px}@media(max-width:600px){.ufc-body{min-height:220px}.ufc-person img,.ufc-silhouette{height:160px}}</style></head><body><header style="text-align:center"><small class="gold">LUTADOR DE ELITE COMBAT</small><h1>LEC PADOVA 01</h1></header><main><h1>TABELLONE · TEAM CHALLENGE</h1><div id="bracket" class="grid"></div></main><script>
const cats=['Donna ≤60 kg','Uomo ≤70 kg','Uomo 70–80 kg','Uomo 80–90 kg'];const extraNames=['Superfight · Donna','Superfight · Master uomo','Superfight · Adult uomo','MMA Pro · Co-Main','MMA Pro · Main Event'];const defaults=()=>({teams:['Nova Dojo','Squadra B','Squadra C','Squadra D'].map(name=>({name,athletes:['Da definire','Da definire','Da definire','Da definire'],photos:['','','','']})),matches:[{scores:['','','',''],tie:''},{scores:['','','',''],tie:''},{scores:['','','',''],tie:''}],extras:extraNames.map(title=>({title,a:'Da definire',b:'Da definire',result:'',teamA:'',teamB:'',photoA:'',photoB:''})),stream:''});let state;try{state=JSON.parse(localStorage.getItem('lecDemo'))||defaults()}catch(e){state=defaults()}function persist(){localStorage.setItem('lecDemo',JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function result(m){let s=m.scores;if(s.some(v=>v===''||!['0','1'].includes(String(v))))return null;let n=s.reduce((a,v)=>a+Number(v),0);if(n>2)return 0;if(n<2)return 1;return m.tie==='0'?0:m.tie==='1'?1:null}function finalists(){let a=result(state.matches[0]),b=result(state.matches[1]);return [a===null?null:state.teams[a],b===null?null:state.teams[2+b]]}function names(i){if(i<2)return[state.teams[i*2],state.teams[i*2+1]];return finalists()}function athleteBox(t,j){let name=t?.athletes?.[j]||'Da definire',photo=t?.photos?.[j]||'',team=t?.name||'Da definire';return `<div class="athlete-card">${photo?`<img src="${esc(photo)}" alt="Foto di ${esc(name)}">`:'<div class="placeholder">◉</div>'}<strong>${esc(name)}</strong><small>${esc(team)}</small></div>`}
function renderBracket(){let html='';for(let i=0;i<3;i++){let m=state.matches[i],pair=names(i),win=result(m);html+=`<div class="fight"><div class="tag match-title">${i===2?'FINALE':'SEMIFINALE '+(i+1)}</div>`;pair.forEach((t,j)=>{html+=`<div class="fighter"><span>${esc(t?.name||'Vincente semifinale '+(j+1))}</span>${win===j?'<b>VINCENTE</b>':''}</div>`});cats.forEach((cat,j)=>{html+=`<div class="bout"><div class="tag">${esc(cat)}</div><div class="versus">${athleteBox(pair[0],j)}<div class="vs">VS</div>${athleteBox(pair[1],j)}</div>${m.scores[j]!==''?`<small>Vincitore: ${esc(pair[m.scores[j]==='1'?0:1]?.athletes?.[j]||'Da definire')}</small>`:''}</div>`});let played=m.scores.filter(v=>v!=='').length;html+=`<small>${played}/4 incontri registrati${played===4?' · '+m.scores.reduce((a,v)=>a+Number(v),0)+'–'+(4-m.scores.reduce((a,v)=>a+Number(v),0)):''}</small></div>`}document.getElementById('bracket').innerHTML=html}

function refresh(){try{state=JSON.parse(localStorage.getItem("lecDemo"))||defaults()}catch(e){state=defaults()}renderBracket()}refresh();window.addEventListener("storage",refresh);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});</script></body></html>
