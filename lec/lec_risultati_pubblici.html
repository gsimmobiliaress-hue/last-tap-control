<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEC PADOVA 01 · Risultati ufficiali</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif;background:#090a0c;color:#f7f5ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#41301a 0%,#101014 42%,#090a0c 100%);min-height:100vh}.top{text-align:center;padding:34px 12px 18px;border-bottom:1px solid #5c4729}.kicker{letter-spacing:5px;font-size:12px;color:#d6b36e}.top h1{font-size:clamp(29px,5vw,56px);margin:7px 0;letter-spacing:2px}.top p{color:#aaa;margin:0}main{max-width:1250px;margin:auto;padding:22px 16px 80px}.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}.filters button,.actions button{border:1px solid #9c783d;background:#1e1b19;color:#f0d293;padding:10px 16px;border-radius:7px;cursor:pointer}.filters button.on{background:#d4ac63;color:#15120b;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:18px}.fight{background:linear-gradient(135deg,#1e1d21,#101014);border:1px solid #6b522b;border-radius:13px;overflow:hidden}.fighthead{background:linear-gradient(90deg,#5a431e,#b88d42,#5a431e);color:#0e0c09;font-weight:900;letter-spacing:2px;text-align:center;padding:9px;font-size:12px}.people{display:grid;grid-template-columns:minmax(0,1fr) 45px minmax(0,1fr);align-items:center;padding:15px 10px 10px}.person{text-align:center;min-width:0}.photo{height:175px;width:min(100%,170px);object-fit:cover;object-position:center top;border-radius:8px;background:#2b2a2e;border:1px solid #56472e}.empty{display:flex;align-items:center;justify-content:center;margin:auto;font-size:60px;color:#665a45}.name{font-size:clamp(15px,2vw,21px);font-weight:900;text-transform:uppercase;overflow-wrap:anywhere;margin-top:9px}.team{font-size:12px;color:#c5aa77;margin-top:5px;overflow-wrap:anywhere}.vs{font-size:25px;font-weight:1000;font-style:italic;color:#e8c37b;text-align:center}.winner .name{color:#f4cc76}.winner .photo{border:2px solid #e9bd63;box-shadow:0 0 18px #e9b75244}.foot{text-align:center;padding:12px;border-top:1px solid #3a3327;background:#131315}.status{font-weight:850;color:#eac477}.detail{color:#ccc;margin-top:5px;font-size:13px}.actions{text-align:center;margin-top:24px}.small{color:#8d8b88;font-size:12px;text-align:center;margin-top:15px}@media(max-width:550px){.photo{height:125px}.people{grid-template-columns:minmax(0,1fr) 33px minmax(0,1fr)}.vs{font-size:18px}}
</style></head><body><header class="top"><div class="kicker">LUTADOR DE ELITE COMBAT</div><h1>LEC PADOVA 01</h1><p>RISULTATI · SUPERFIGHT & MMA PRO</p></header><main><div class="filters"><button class="on" data-filter="all">Tutti</button><button data-filter="sf">Superfight</button><button data-filter="mma">MMA Pro</button><button data-filter="finished">Conclusi</button></div><div class="grid" id="cards"></div><div class="actions"><button onclick="document.documentElement.requestFullscreen?.()">Schermo intero</button></div><p class="small">Schermata pubblica di sola lettura · Aggiornamento automatico sullo stesso browser e origine</p></main><script>
const titles=['SUPERFIGHT FEMMINILE','SUPERFIGHT MASTER','SUPERFIGHT ADULT','MMA PRO · CO-MAIN EVENT','MMA PRO · MAIN EVENT'];let filter='all';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function portrait(e,side){let name=e[side==='A'?'a':'b']||'Da definire',team=e['team'+side]||'Team da definire',pic=e['photo'+side],won=e.winner===side;return `<div class="person ${won?'winner':''}">${pic?`<img class="photo" src="${esc(pic)}" alt="Foto ${esc(name)}">`:'<div class="photo empty">◉</div>'}<div class="name">${won?'★ ':''}${esc(name)}</div><div class="team">${esc(team)}</div></div>`}function render(){let data;try{data=JSON.parse(localStorage.getItem('lecDemo')||'{}')}catch{}let xs=data?.extras||[];let cards=xs.map((e,i)=>({...e,i})).filter(e=>filter==='all'||(filter==='sf'&&e.i<3)||(filter==='mma'&&e.i>=3)||(filter==='finished'&&!!e.winner));document.getElementById('cards').innerHTML=cards.length?cards.map(e=>{let name=e.winner==='A'?e.a:e.winner==='B'?e.b:e.winner==='DRAW'?'PAREGGIO / NO CONTEST':'DA DISPUTARE';let details=[e.method,e.round?'Round '+e.round:'',e.time?'Tempo '+e.time:'',e.result].filter(Boolean).join(' · ');return `<article class="fight"><div class="fighthead">${titles[e.i]}</div><div class="people">${portrait(e,'A')}<div class="vs">VS</div>${portrait(e,'B')}</div><div class="foot"><div class="status">${e.winner&&e.winner!=='DRAW'?'VINCITORE: ':''}${esc(name)}</div>${details?`<div class="detail">${esc(details)}</div>`:''}</div></article>`}).join(''):'<p style="text-align:center;color:#bbb">Nessun incontro da visualizzare.</p>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});window.addEventListener('storage',render);setInterval(render,4000);render();
</script></body></html>
